<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Of Rising Bangla - News Card Generator</title>
    <style>
        :root {
            --primary-red: #8b0000;
            --brand-red: #b71c1c;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #222222;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: var(--brand-red);
            text-align: center;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #444;
        }
        input[type="text"], input[type="password"], input[type="date"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 70px;
        }
        input[type="file"] {
            border: 1px dashed var(--brand-red);
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            background: #fff9f9;
            box-sizing: border-box;
        }
        .control-row {
            display: flex;
            gap: 15px;
        }
        .control-col {
            flex: 1;
        }
        .btn {
            background: var(--brand-red);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover {
            background: var(--primary-red);
        }
        .btn-secondary {
            background: #555;
            margin-top: 10px;
        }
        .preview-container {
            text-align: center;
            margin-top: 25px;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .hidden {
            display: none !important;
        }
        .logo-status {
            font-size: 13px;
            color: #2e7d32;
            margin-top: 4px;
            font-weight: bold;
        }
        .logout-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffebee;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #555;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- লগইন সেকশন -->
    <div id="loginSection">
        <h2>🔒 এডমিন লগইন</h2>
        <p style="text-align: center; color: #666; font-size: 14px;">ফটো কার্ড জেনারেটর ব্যবহার করতে পাসওয়ার্ড দিন</p>
        <div class="form-group">
            <label>পাসওয়ার্ড দিন:</label>
            <input type="password" id="adminPassword" placeholder="ডিফল্ট পাসওয়ার্ড: vor123">
        </div>
        <button class="btn" onclick="checkLogin()">লগইন করুন</button>
        <p id="loginError" style="color: red; text-align: center; font-size: 14px; margin-top: 10px;"></p>
    </div>

    <!-- মূল জেনারেটর প্যানেল -->
    <div id="generatorSection" class="hidden">
        <div class="logout-bar">
            <span>স্বাগতম, <b>Voice Of Rising Bangla</b></span>
            <button onclick="logout()" style="background: #c62828; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer;">লগআউট</button>
        </div>

        <h2>Voice Of Rising Bangla</h2>
        <h3>প্রফেশনাল ফটো কার্ড জেনারেটর</h3>

        <!-- লোগো আপলোড -->
        <div class="form-group">
            <label>পোর্টাল লোগো (একবার আপলোড করলেই গোল হয়ে সেভ থাকবে):</label>
            <input type="file" id="logoInput" accept="image/*" onchange="saveLogo(event)">
            <div id="logoStatus" class="logo-status"></div>
            <button type="button" onclick="clearLogo()" class="btn btn-secondary" style="padding: 6px; font-size: 13px; width: auto; margin-top: 5px;">লোগো পরিবর্তন করুন</button>
        </div>

        <!-- খবরের ছবি -->
        <div class="form-group">
            <label>খবরের মূল ছবি আপলোড করুন (একাধিক করা যাবে):</label>
            <input type="file" id="newsImageInput" accept="image/*" multiple onchange="generateCard()">
        </div>

        <!-- তারিখ -->
        <div class="form-group">
            <label>তারিখ সিলেক্ট করুন:</label>
            <input type="date" id="newsDate" onchange="generateCard()">
        </div>

        <!-- শিরোনাম -->
        <div class="form-group">
            <label>খবরের শিরোনাম লিখুন:</label>
            <textarea id="newsHeadline" placeholder="এখানে খবরের শিরোনাম লিখুন..." oninput="generateCard()"></textarea>
        </div>

        <!-- বিস্তারিত কমেন্টে অপশন (ঐচ্ছিক) -->
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" id="commentTag" onchange="generateCard()">
                <b>"বিস্তারিত কমেন্টে"</b> ট্যাগ যুক্ত করুন (ঐচ্ছিক)
            </label>
        </div>

        <!-- বিজ্ঞাপন ছবি (ঐচ্ছিক) -->
        <div class="form-group">
            <label>বিজ্ঞাপন ব্যানার আপলোড করুন — কার্ডের একদম নিচে বসবে (ঐচ্ছিক):</label>
            <input type="file" id="adImageInput" accept="image/*" onchange="generateCard()">
        </div>

        <!-- কাস্টমাইজেশন স্লাইডার -->
        <div class="control-row">
            <div class="control-col form-group">
                <div class="slider-label">
                    <label>টেক্সট পজিশন (উপরে / নিচে):</label>
                    <span id="posVal">670px</span>
                </div>
                <input type="range" id="textYPos" min="620" max="820" value="670" oninput="updateControls()">
            </div>
            <div class="control-col form-group">
                <div class="slider-label">
                    <label>ফন্ট সাইজ:</label>
                    <span id="sizeVal">46px</span>
                </div>
                <input type="range" id="fontSize" min="30" max="62" value="46" oninput="updateControls()">
            </div>
        </div>

        <button class="btn" onclick="generateCard()">কার্ড রিফ্রেশ করুন</button>

        <!-- প্রিভিউ ও ডাউনলোড -->
        <div class="preview-container">
            <canvas id="cardCanvas" width="1080" height="1080" class="hidden"></canvas>
            <br>
            <a id="downloadBtn" class="btn hidden" style="background: #2e7d32; text-decoration: none; display: inline-block; box-sizing: border-box; margin-top: 15px;" download="vor-news-card.jpg">এইচডি (HD) ফটো কার্ড ডাউনলোড করুন</a>
        </div>

        <!-- পাসওয়ার্ড পরিবর্তন -->
        <div style="margin-top: 40px; border-top: 1px solid #ddd; padding-top: 15px;">
            <details>
                <summary style="cursor: pointer; color: #555; font-weight: bold;">পাসওয়ার্ড পরিবর্তন করুন</summary>
                <div style="margin-top: 10px;">
                    <input type="password" id="newPassword" placeholder="নতুন পাসওয়ার্ড দিন" style="margin-bottom: 8px;">
                    <button class="btn" style="background: #37474f;" onclick="changePassword()">পাসওয়ার্ড আপডেট করুন</button>
                </div>
            </details>
        </div>
    </div>
</div>

<script>
    if (!localStorage.getItem('vor_admin_pass')) {
        localStorage.setItem('vor_admin_pass', 'vor123');
    }

    window.onload = function() {
        if (sessionStorage.getItem('vor_logged_in') === 'true') {
            showGenerator();
        }
        checkStoredLogo();
        document.getElementById('newsDate').valueAsDate = new Date();
    };

    function checkLogin() {
        let pass = document.getElementById('adminPassword').value;
        let savedPass = localStorage.getItem('vor_admin_pass');
        if (pass === savedPass) {
            sessionStorage.setItem('vor_logged_in', 'true');
            showGenerator();
        } else {
            document.getElementById('loginError').innerText = 'ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন।';
        }
    }

    function showGenerator() {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('generatorSection').classList.remove('hidden');
    }

    function logout() {
        sessionStorage.removeItem('vor_logged_in');
        document.getElementById('generatorSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('adminPassword').value = '';
        document.getElementById('loginError').innerText = '';
    }

    function changePassword() {
        let newPass = document.getElementById('newPassword').value;
        if (newPass.trim() !== '') {
            localStorage.setItem('vor_admin_pass', newPass);
            alert('পাসওয়ার্ড সফলভাবে পরিবর্তন করা হয়েছে!');
            document.getElementById('newPassword').value = '';
        } else {
            alert('দয়া করে একটি নতুন পাসওয়ার্ড লিখুন।');
        }
    }

    function saveLogo(event) {
        let file = event.target.files[0];
        if (file) {
            let reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem('vor_logo', e.target.result);
                checkStoredLogo();
                generateCard();
            };
            reader.readAsDataURL(file);
        }
    }

    function checkStoredLogo() {
        let logoStatus = document.getElementById('logoStatus');
        if (localStorage.getItem('vor_logo')) {
            logoStatus.innerText = '✓ লোগো সফলভাবে সেভ করা আছে।';
        } else {
            logoStatus.innerText = '⚠ কোনো লোগো সেভ করা নেই, দয়া করে লোগো আপলোড করুন।';
        }
    }

    function clearLogo() {
        localStorage.removeItem('vor_logo');
        checkStoredLogo();
        alert('লোগো মুছে ফেলা হয়েছে। নতুন লোগো আপলোড করুন।');
        generateCard();
    }

    function updateControls() {
        document.getElementById('posVal').innerText = document.getElementById('textYPos').value + 'px';
        document.getElementById('sizeVal').innerText = document.getElementById('fontSize').value + 'px';
        generateCard();
    }

    function generateCard() {
        let headline = document.getElementById('newsHeadline').value;
        let newsDate = document.getElementById('newsDate').value;
        let newsImageInput = document.getElementById('newsImageInput');
        let adImageInput = document.getElementById('adImageInput');
        let storedLogo = localStorage.getItem('vor_logo');

        let canvas = document.getElementById('cardCanvas');
        let ctx = canvas.getContext('2d');
        canvas.classList.remove('hidden');

        // ১. গাঢ় লাল ব্যাকগ্রাউন্ড (১০৮০ x ১০৮০)
        ctx.fillStyle = '#8b0000';
        ctx.fillRect(0, 0, 1080, 1080);

        // ২. মূল খবর পিকচার রেন্ডার
        if (newsImageInput.files && newsImageInput.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                let img = new Image();
                img.onload = function() {
                    ctx.drawImage(img, 0, 0, 1080, 620);
                    drawCardDetails(ctx, headline, newsDate, storedLogo, adImageInput);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(newsImageInput.files[0]);
        } else {
            ctx.fillStyle = '#cccccc';
            ctx.fillRect(0, 0, 1080, 620);
            ctx.fillStyle = '#333333';
            ctx.font = 'bold 36px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('খবরের মূল ছবি এখানে থাকবে', 540, 310);
            drawCardDetails(ctx, headline, newsDate, storedLogo, adImageInput);
        }
    }

    function drawCardDetails(ctx, headline, newsDate, storedLogo, adImageInput) {
        let textY = parseInt(document.getElementById('textYPos').value);
        let fSize = parseInt(document.getElementById('fontSize').value);
        let showCommentTag = document.getElementById('commentTag').checked;

        // ৩. তারিখ ব্যাজ
        let dateY = textY - 55;
        if (newsDate) {
            let formattedDate = formatDate(newsDate);
            ctx.fillStyle = '#b71c1c';
            ctx.fillRect(415, dateY, 250, 36);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('তারিখ: ' + formattedDate, 540, dateY + 25);
        }

        // ৪. খবরের শিরোনাম
        let lastY = textY + 20;
        if (headline) {
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold ' + fSize + 'px sans-serif';
            ctx.textAlign = 'center';
            lastY = wrapTextCenter(ctx, headline, 540, textY + 20, 960, fSize + 15);
        } else {
            ctx.fillStyle = '#ffcccc';
            ctx.font = 'italic 36px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('এখানে খবরের শিরোনাম প্রদর্শিত হবে', 540, textY + 20);
            lastY += 30;
        }

        // ৫. "বিস্তারিত কমেন্টে" ব্যাজ (ঐচ্ছিক)
        if (showCommentTag) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(430, lastY + 15, 220, 32);
            ctx.fillStyle = '#b71c1c';
            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('► বিস্তারিত কমেন্টে', 540, lastY + 37);
        }

        // ৬. ফুটার ব্র্যান্ডিং (সাইট ও ইউআরএল)
        let hasAd = adImageInput.files && adImageInput.files[0];
        let footerY = hasAd ? 930 : 980;

        ctx.fillStyle = '#ffcccc';
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('VOR Bangla News', 540, footerY);

        ctx.fillStyle = '#ffffff';
        ctx.font = '20px sans-serif';
        ctx.fillText('voiceofrisingbangla.com  |  ⓕ 𝕏 📷 @voiceofrisingbangla', 540, footerY + 30);

        // ৭. অ্যাড ব্যানার (একদম নিচে - ঐচ্ছিক)
        if (hasAd) {
            let reader = new FileReader();
            reader.onload = function(e) {
                let adImg = new Image();
                adImg.onload = function() {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 980, 1080, 100);
                    ctx.drawImage(adImg, 10, 985, 1060, 90);
                    drawLogo(ctx, storedLogo);
                };
                adImg.src = e.target.result;
            };
            reader.readAsDataURL(adImageInput.files[0]);
        } else {
            drawLogo(ctx, storedLogo);
        }
    }

    function drawLogo(ctx, storedLogo) {
        // ৮. বৃত্তাকার লোগো (ওপরের ডানপাশে)
        if (storedLogo) {
            let logoImg = new Image();
            logoImg.onload = function() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(970, 85, 65, 0, Math.PI * 2, true);
                ctx.closePath();
                ctx.clip();

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(905, 20, 130, 130);
                ctx.drawImage(logoImg, 905, 20, 130, 130);
                ctx.restore();

                ctx.beginPath();
                ctx.arc(970, 85, 65, 0, Math.PI * 2, true);
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                finalizeDownload();
            };
            logoImg.src = storedLogo;
        } else {
            finalizeDownload();
        }
    }

    function wrapTextCenter(context, text, x, y, maxWidth, lineHeight) {
        let words = text.split(' ');
        let line = '';
        let lines = [];

        for (let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = context.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                lines.push(line);
                line = words[n] + ' ';
            } else {
                line = testLine;
            }
        }
        lines.push(line);

        let currentY = y;
        for (let k = 0; k < lines.length; k++) {
            context.fillText(lines[k], x, currentY);
            currentY += lineHeight;
        }
        return currentY - lineHeight;
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        let parts = dateStr.split('-');
        return parts[2] + '/' + parts[1] + '/' + parts[0];
    }

    function finalizeDownload() {
        let canvas = document.getElementById('cardCanvas');
        let link = document.getElementById('downloadBtn');
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.classList.remove('hidden');
    }
</script>

</body>
</html>
