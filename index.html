<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Of Rising Bangla - Photo Card Layout Preview</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --red: #8b0000;
            --bright-red: #b71c1c;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            margin-top: 0;
            color: #ef4444;
            text-align: center;
        }
        .layout-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }
        @media (max-width: 800px) {
            .layout-grid {
                grid-template-columns: 1fr;
            }
        }
        .controls-panel {
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .control-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--muted);
            font-weight: 600;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #ef4444;
        }
        .preview-card {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1/1;
            background: var(--red);
            margin: 0 auto;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .image-container {
            width: 100%;
            height: 55%;
            background: #334155 url('https://picsum.photos/800/500') center/cover no-repeat;
            position: relative;
        }
        .logo-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--red);
            font-size: 14px;
        }
        .ad-banner {
            background: #ffffff;
            color: #1e293b;
            text-align: center;
            padding: 6px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 2px solid #cbd5e1;
        }
        .text-section {
            flex: 1;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: space-between;
        }
        .date-badge {
            background: var(--bright-red);
            color: white;
            padding: 3px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .headline {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.3;
            margin: 0;
            transition: all 0.2s;
        }
        .footer {
            margin-top: auto;
            width: 100%;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 8px;
        }
        .footer-title {
            color: #fca5a5;
            font-weight: bold;
            font-size: 13px;
        }
        .footer-sub {
            color: #ffffff;
            font-size: 11px;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <h2>Voice Of Rising Bangla - কার্ড ডিজাইন কনসেপ্ট</h2>

    <div class="layout-grid">
        <div class="controls-panel">
            <h3>কন্ট্রোল সিমুলেশন</h3>
            
            <div class="control-group">
                <label>টেক্সট সাইজ (Font Size)</label>
                <input type="range" id="sizeSlider" min="16" max="28" value="20" oninput="updatePreview()">
            </div>

            <div class="control-group">
                <label>পজিশন (Vertical Gap)</label>
                <input type="range" id="posSlider" min="0" max="25" value="10" oninput="updatePreview()">
            </div>

            <div class="control-group">
                <label>বিজ্ঞাপন ব্যানার</label>
                <input type="checkbox" id="adToggle" checked onchange="toggleAd()">
                <span style="font-size: 13px; color: var(--muted);">অ্যাড অন/অফ</span>
            </div>
        </div>

        <div>
            <div class="preview-card">
                <div class="image-container">
                    <div class="logo-badge">VOR</div>
                </div>

                <div class="ad-banner" id="adBanner">
                    📢 বিজ্ঞাপনের ছবি/ব্যানার (ঐচ্ছিক স্পনসর স্পেস)
                </div>

                <div class="text-section" id="textSection">
                    <div class="date-badge">তারিখ: ২৯/১০/২০২৬</div>
                    
                    <h3 class="headline" id="headlineText">
                        লংমার্চের নামে জাতীয় সম্পদ অপচয় করছে চরমপন্থীরা: বিশেষ সংবাদ
                    </h3>

                    <div class="footer">
                        <div class="footer-title">VOR Bangla News</div>
                        <div class="footer-sub">voiceofrisingbangla.com | @voiceofrisingbangla</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updatePreview() {
            const size = document.getElementById('sizeSlider').value;
            const pos = document.getElementById('posSlider').value;
            const headline = document.getElementById('headlineText');
            const section = document.getElementById('textSection');

            headline.style.fontSize = size + 'px';
            section.style.paddingTop = pos + 'px';
        }

        function toggleAd() {
            const ad = document.getElementById('adBanner');
            const checked = document.getElementById('adToggle').checked;
            ad.style.display = checked ? 'block' : 'none';
        }
    </script>
</body>
</html>
